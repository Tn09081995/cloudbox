name: Build & Deploy Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Android Debug APK
        working-directory: android
        run: |
          gradle assembleDebug --stacktrace

      - name: Deploy APK to public and Push
        run: |
          mkdir -p public
          APK_FILE=$(find android -name "*.apk" -type f | head -n 1)
          echo "Found APK: $APK_FILE"
          cp "$APK_FILE" public/cloudbox.apk
          ls -lh public/cloudbox.apk

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/cloudbox.apk
          git commit -m "build: add cloudbox.apk to public [skip ci]" || echo "No changes to commit"
          git push origin HEAD:main

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloudbox-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
