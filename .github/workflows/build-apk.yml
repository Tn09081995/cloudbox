name: Build & Deploy Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Android Debug APK
        working-directory: android
        run: |
          gradle assembleDebug --stacktrace

      - name: Verify APK
        run: |
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p public
          cp android/app/build/outputs/apk/debug/app-debug.apk public/cloudbox.apk
          ls -lh public/cloudbox.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudBox-Android-APK
          path: public/cloudbox.apk
          if-no-files-found: error

      - name: Commit and Push APK to main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/cloudbox.apk
          git commit -m "build: update Android APK in public/cloudbox.apk [skip ci]" || echo "No changes to commit"
          git push origin main

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "CloudBox Android App v1.0.0"
          body: |
            ### 📱 CloudBox Android App APK (v1.0.0)
            - Ứng dụng lưu trữ đám mây 5 TB cá nhân.
            - Hỗ trợ tải ảnh/video trực tiếp từ thư viện điện thoại.
            - Đồng bộ tức thì với Google Drive và Supabase.
          files: public/cloudbox.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
